# Render Blueprint for RetailMind.
#
# After deploying:
#   1. Run Wuzapi somewhere reachable (local Docker via ngrok, or its own Render
#      docker service). Pair your WhatsApp number, set the webhook to
#      https://<retailmind-service>.onrender.com/webhook/whatsapp.
#   2. In the RetailMind service → add secret env vars (see below).
#   3. Add Google OAuth redirect URI in Google Cloud Console:
#      https://<retailmind-service>.onrender.com/auth/google/callback
#
# Secret env vars to set manually in Render dashboard (never in git):
#   LLM_API_KEY        (Groq key from console.groq.com)
#   WUZAPI_API_URL     (https://<your-wuzapi-host>:8080)
#   WUZAPI_TOKEN       (per-user token from Wuzapi admin panel)
#   SUPABASE_URL, SUPABASE_KEY
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_REDIRECT_URI
#   GOOGLE_API_KEY     (for the in-browser Picker widget; restrict to Picker API)
#   APP_BASE_URL       (= https://<retailmind>.onrender.com)

services:
  - type: web
    name: retailmind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: WUZAPI_API_URL
        sync: false
      - key: WUZAPI_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
