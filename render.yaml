# Render Blueprint for RetailMind.
#
# After creating the Blueprint from this repo, in the Render dashboard add:
#   Environment > Environment Variables (Secret):
#     LLM_API_KEY, TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_FROM
#   Environment > Secret Files (NEVER in git):
#     service-account.json    -> the GCP service-account key JSON contents
#     retailers_prod.yaml     -> the real retailer config (has the phone number)
# Then point the Twilio sandbox inbound webhook at:
#     https://<service>.onrender.com/webhook/whatsapp
#
# Note: Render free web services sleep after ~15 min idle; the in-process
# scheduler sleeps with them. Keep it warm with an external pinger on /health
# (handled as a separate deploy step).
services:
  - type: web
    name: retailmind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: qwen/qwen3-next-80b-a3b-instruct:free
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        value: ./service-account.json        # provided via Render Secret File
      - key: RETAILMIND_CONFIG
        value: ./retailers_prod.yaml          # provided via Render Secret File
      - key: LLM_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
